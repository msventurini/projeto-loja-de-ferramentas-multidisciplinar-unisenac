[project]
name = "powertool-repair-shop-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "msventurini", email = "msventurini@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flasgger>=0.9.7.1",
    "flask>=3.1.3",
    "mysql-connector-python>=26.7.0"
]

[project.scripts]
powertool-repair-shop-api = "powertool_repair_shop_api:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"


